# ============================================================================
#  prep.config.yaml  —  ★ 주제가 정해지면 이 파일과 web/project.config.js만 고칩니다
# ============================================================================
#  실행:  python3 pipeline.py --config prep.config.yaml
# ============================================================================

# ── 경로 ────────────────────────────────────────────────────────────────
# raw 아래에 클래스별 하위 폴더를 두세요. 폴더 이름이 클래스 id가 됩니다.
#
#   data/raw/
#   ├── normal/      ← web/project.config.js의 클래스 id와 일치시킬 것
#   ├── suspect/
#   └── abnormal/
#
paths:
  raw: ../data/raw
  out: ../data/prepared

# ── 클래스 ──────────────────────────────────────────────────────────────
# 비워 두면 raw 아래 폴더를 자동으로 훑습니다.
# 명시하면 그 클래스만 처리하고, 없는 폴더는 경고로 알려 줍니다.
classes: []
# classes: [normal, suspect, abnormal, invalid]

# ── 홀드아웃 분할 ───────────────────────────────────────────────────────
# ★ 가장 중요한 설정입니다.
# TM은 학습/검증 분할을 우리가 통제할 수 없습니다(자동 랜덤 분할). 증강 이미지를
# 올리면 같은 원본의 회전본이 학습셋과 검증셋에 동시에 들어가 정확도가 부풀려집니다.
# 그래서 여기서 미리 홀드아웃을 떼어내고, 그건 TM에 올리지 않습니다.
split:
  holdout_ratio: 0.20
  seed: 20260728

  # 원본(=환자) 단위로 분할합니다. 같은 환자/같은 원본에서 나온 이미지가
  # train과 holdout에 흩어지면 성능이 과대평가됩니다 (데이터 누출).
  #
  # 파일명에서 그룹 키를 뽑는 정규식. 첫 번째 캡처 그룹이 키가 됩니다.
  #   예) patient001_view2.png → '^(patient\d+)' → 'patient001'
  #   예) IM-0115-0001.jpeg    → '^(IM-\d+)'     → 'IM-0115'
  #   예) from_csv.py 로 정리한 경우 → '^([^_]+)__'   (그룹 키가 앞에 붙습니다)
  #
  # ⚠️ 반드시 작은따옴표를 쓰세요. YAML은 큰따옴표 안의 \d 를 잘못된 이스케이프로
  #    보고 거부합니다.  "^(patient\d+)"  ✗   '^(patient\d+)'  ✓
  #
  # null 이면 파일 하나를 하나의 그룹으로 봅니다 (누출 위험 있음 — 데이터셋에
  # 환자당 여러 장이 있다면 반드시 정규식을 지정하세요).
  group_regex: '^([^_]+)__'

# ── 전처리 ──────────────────────────────────────────────────────────────
# ★ 성능 기여도 1위입니다. TM은 입력을 224x224로 줄이므로, 1024x1024 영상을
#   그대로 넣으면 병변이 몇 픽셀로 소실됩니다. 미리 잘라 넣어야 합니다.
preprocess:
  size: 224

  # 검은 여백/장비 테두리를 자동으로 잘라냅니다 (X-ray, 내시경 원형 시야 등)
  auto_border_crop: true
  border_threshold: 12        # 이 밝기 이하를 여백으로 봅니다

  # 가장자리를 비율만큼 추가로 잘라냅니다.
  # 영상 구석에 번인된 환자 정보 텍스트를 제거하는 효과도 있습니다.
  edge_trim: 0.02

  # ★ web/project.config.js의 decision.inferRoi와 반드시 같은 값을 쓰세요.
  #   학습 전처리와 추론 전처리를 일치시키는 것이 정확도에 크게 기여합니다.
  center_crop: 0.85

  # 정사각화 방식
  #   crop      — 짧은 변 기준으로 잘라냄 (기본, 왜곡 없음 / 정보 일부 손실)
  #   letterbox — 여백을 채워 전체를 보존 (긴 영상에서 대상이 작아짐)
  square_mode: crop

  # CLAHE — 대비 제한 적응 히스토그램 평활화.
  # 저대비 의료영상에서 MobileNet이 놓치던 경계를 살립니다. 효과가 큽니다.
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid: 8

  # 그레이스케일 영상을 3채널로 복제 (MobileNet은 3채널 입력을 받습니다)
  force_rgb: true

  out_format: png             # png (무손실) | jpg
  jpg_quality: 95

# ── 중복 제거 ───────────────────────────────────────────────────────────
# 공개 데이터셋에는 중복/근중복 이미지가 흔합니다. 같은 이미지가 train과
# holdout에 동시에 있으면 성능이 크게 부풀려집니다.
# ⚠️ 의료영상은 구조가 균일해서(같은 부위·같은 촬영 프로토콜) 서로 다른 개체끼리도
#    dHash가 비슷합니다. 임계값을 높이면 멀쩡한 데이터가 대량으로 삭제됩니다.
#    2에서 시작하고, report.md의 제거 비율을 보며 조정하세요.
#    비교는 항상 같은 클래스 안에서만 이뤄집니다.
dedup:
  enabled: true
  hamming_threshold: 2        # dHash 해밍거리(64비트). 0=완전 동일만, 2=안전, 5+=위험

# ── 클래스 균형 ─────────────────────────────────────────────────────────
balance:
  # 클래스당 최대 원본 장수. TM은 브라우저에서 학습하므로 RAM 제약이 있습니다.
  # 증강 배수를 곱한 값이 최종 업로드 장수입니다. (예: 400 x 4배 = 1600장)
  max_per_class: 400
  # 가장 적은 클래스에 맞춰 전부 잘라냅니다 (불균형 제거)
  equalize: false
